
# Build only the Windows x64 installer and attach it to a draft release.
name: release

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: cargo test --workspace
      - run: npx vitest run
      - run: npx svelte-check --threshold error

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: npm ci

      - name: Build Windows x64 installer
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Prepare installer
        shell: bash
        run: |
          set -euo pipefail

          dir="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"

          if [ ! -d "$dir" ]; then
            dir="target/x86_64-pc-windows-msvc/release/bundle/nsis"
          fi

          f=$(find "$dir" -maxdepth 1 -type f -iname '*-setup.exe' | head -n 1)

          if [ -z "$f" ]; then
            echo "ERROR: NSIS installer was not found."
            exit 1
          fi

          cp "$f" Mosamem-Setup-x64.exe
          sha256sum Mosamem-Setup-x64.exe > Mosamem-Setup-x64.exe.sha256

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            Mosamem-Setup-x64.exe
            Mosamem-Setup-x64.exe.sha256
