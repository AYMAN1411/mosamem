<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Mosamem app icon: the mark (an initial meem, مـ, as one brush stroke) on a graphite tile.
       The tile follows the macOS icon grid: 824 px with room for the shadow. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30333b"/>
      <stop offset="1" stop-color="#1d1f24"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fdcc2"/>
      <stop offset="1" stop-color="#2fae95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <g transform="translate(512 512) scale(13) translate(-32 -30)">
    <path d="M15 39 L37 39 C44 39 49 35.5 49 29.5 C49 23.5 44.5 20 40 20.5 C35 21 32.5 25.5 33.5 30.5 C34.3 34.5 37 37.5 40.5 38.6"
      fill="none" stroke="url(#ink)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
