[package]
name = "mosamem"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mosamem — an Arabic-first image editor"

[lib]
name = "mosamem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compiles the test harness into release builds (never in shipped installers).
harness = []

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mosamem-core = { path = "../crates/mosamem-core" }
tauri-plugin-dialog = "2.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "webp", "rayon"] }
webp = "0.3.1"
jpeg-encoder = "0.7.1"
png = "0.18.1"
tiff = "0.11.3"
moxcms = "0.9.1"
rayon = "1.12"
parking_lot = "0.12"
thiserror = "2"
tiny_http = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8"
lz4_flex = "0.14"
# Local AI: ONNX Runtime (prebuilt, fetched at build time) with a GPU provider (below); models are
# downloaded on first use (ureq) and checked by SHA-256.
ort = "=2.0.0-rc.15"
ureq = "3.4"
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-image-io = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "block2"] }
block2 = "0.6"

# Windows builds are cross-compiled from the Mac (cargo-xwin); BLAKE3's hand-written NEON C doesn't
# compile with that toolchain's headers, so Windows uses its pure-Rust code.
[target.'cfg(windows)'.dependencies]
blake3 = { version = "1.8.2", features = ["pure"] }
# the GPU path: DirectML on Windows (ONNX Runtime's prebuilt has no WebGPU for arm64 there),
# WebGPU on the Mac
ort = { version = "=2.0.0-rc.15", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies.ort]
version = "=2.0.0-rc.15"
features = ["webgpu"]
